<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ingestion</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="login-page">
  <form id="login" class="login-card">
    <img class="logo" src="/logo.svg" alt="" />
    <h1>Ingestion</h1>
    <p class="muted small">This demo is password protected.</p>
    <input type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required />
    <button class="primary" type="submit">Enter</button>
    <div class="error" id="err"></div>
  </form>
  <script>
    fetch("/api/warm").catch(() => {}); // wake the database while the password is typed
    document.getElementById("login").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector("button");
      btn.disabled = true;
      const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: e.target.password.value }) });
      if (r.ok) location.reload();
      else { document.getElementById("err").textContent = "Wrong password"; btn.disabled = false; }
    });
  </script>
</body>
</html>
